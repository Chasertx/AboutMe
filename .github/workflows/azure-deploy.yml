name: Deploy Portfolio to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-client/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./portfolio-client
        run: npm ci

      - name: Build frontend for production
        working-directory: ./portfolio-client
        run: npm run build

      - name: Prepare frontend assets for ASP.NET backend
        run: |
          mkdir -p Portfolio.Api/wwwroot
          cp -R portfolio-client/dist/. Portfolio.Api/wwwroot/

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish .NET app
        run: dotnet publish Portfolio.Api/Portfolio.Api.csproj -c Release -o publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
